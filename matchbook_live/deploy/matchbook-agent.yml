# Matchbook LIVE agent — runs on the Architect's UK machine (self-hosted runner).
#
# Copy to .github/workflows/matchbook-agent.yml in a PRIVATE repo. Never put a
# self-hosted runner on a public repo: a stranger's pull request could run
# code on the machine. This workflow has no pull_request trigger on purpose.
#
# Secrets (repo -> Settings -> Secrets and variables -> Actions -> Secrets):
#   MATCHBOOK_USERNAME, MATCHBOOK_PASSWORD
#   OPENAI_BASE_URL, OPENAI_MODEL, OPENAI_API_KEY (oracle gateway)
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (debriefs)
# Variables (same page -> Variables):
#   MATCHBOOK_LIVE            "1" to send real orders; anything else = dry
#   ORACLE_GBP_PER_1K_TOKENS  e.g. "0.002"; unset -> burn PENDING
#   MB_STATE_DIR              e.g. "C:\olp\matchbook_state" (kept between runs)

name: matchbook-agent

on:
  schedule:
    # BACKUP STARTER only. GitHub's cron never fired on this repo on its first night
    # (and the framework measured its crons 3-7 h late): each cycle starts the next
    # one itself (last step). This hourly tick restarts the chain if it ever breaks;
    # the concurrency group keeps it to one cycle at a time. Off the hour: :00 drops.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "once = one cycle; check = login + balance; repaid = you withdrew the £50 loan; reseed = lift a halt"
        required: true
        default: once
        type: choice
        options: [once, check, repaid, reseed]

concurrency:
  group: matchbook-agent          # never two cycles at once
  cancel-in-progress: false

permissions:
  contents: write                # the ledger step commits ledger/ back to this private repo
  actions: write                 # the last step starts the next cycle

jobs:
  cycle:
    runs-on: [self-hosted, Windows, matchbook-uk]
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      MATCHBOOK_USERNAME: ${{ secrets.MATCHBOOK_USERNAME }}
      MATCHBOOK_PASSWORD: ${{ secrets.MATCHBOOK_PASSWORD }}
      MATCHBOOK_LIVE: ${{ vars.MATCHBOOK_LIVE }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ORACLE_GBP_PER_1K_TOKENS: ${{ vars.ORACLE_GBP_PER_1K_TOKENS }}
      MB_STATE_DIR: ${{ vars.MB_STATE_DIR || 'C:\olp\matchbook_state' }}
      MB_LOSS_STOP_GBP: ${{ vars.MB_LOSS_STOP_GBP }}   # blank = £35; 0 = off
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        shell: cmd
        run: py -3 -m pip install --quiet --disable-pip-version-check requests

      - name: Offline tests (no order goes out if these fail)
        shell: cmd
        run: py -3 -m unittest matchbook_live.tests.test_live

      - name: Check login and balance
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
        shell: cmd
        run: py -3 -m matchbook_live.run --check

      - name: Loan repaid (Architect only — after you withdrew £50 on matchbook.com)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'repaid'
        shell: cmd
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: py -3 -m matchbook_live.run --repaid

      - name: Reseed (Architect only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'reseed'
        shell: cmd
        run: py -3 -m matchbook_live.run --reseed

      - name: Cycle
        if: github.event_name == 'schedule' || inputs.mode == 'once'
        shell: cmd
        env:                                   # Telegram only here: the test step must never message
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Framework-only (Architect, 2026-10-15): the blind oracle backed a 5.5 longshot on
        # invented team news, so only the framework's published picks trade. To bring the
        # oracle back: replace --no-oracle with --max-oracle-calls 6.
        run: py -3 -m matchbook_live.run --once --no-oracle

      - name: Publish ledger (the framework learns from it)
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'once')
        shell: cmd
        run: |
          if not exist ledger mkdir ledger
          for %%f in (ledger.jsonl scorecard.json) do if exist "%MB_STATE_DIR%\%%f" copy /Y "%MB_STATE_DIR%\%%f" ledger\ >nul
          git config user.name "matchbook-agent"
          git config user.email "matchbook-agent@users.noreply.github.com"
          git add ledger
          git diff --cached --quiet && exit /b 0
          git commit -q -m "ledger: graded Matchbook bets + scorecard"
          git pull -q --rebase && git push -q

      - name: Start the next cycle (the chain; stop it by disabling this workflow)
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'once')
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: py -3 -m matchbook_live.chain
